name: Build MPC-HC Dark Mode

on:
  push:
    branches: [ "develop", "main", "master" ]
  pull_request:
    branches: [ "develop", "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build MPC-HC (Release | Win32)
    runs-on: windows-2022

    steps:
      # ── 1. Checkout WITHOUT submodules ──────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      # ── 2. Rewrite git:// → https:// ────────────────────────────────────
      - name: Rewrite git:// to https://
        run: git config --global url."https://".insteadOf "git://"
        shell: pwsh

      # ── 3. Init ONLY top-level submodules, skip broken nested ones ───────
      - name: Init top-level submodules only
        run: |
          git submodule init
          # Get list of top-level submodule paths
          $submodules = git config --file .gitmodules --get-regexp path | ForEach-Object { $_.Split(' ')[1] }
          foreach ($sub in $submodules) {
            Write-Host "Trying submodule: $sub"
            git submodule update --init --depth=1 -- $sub 2>&1
          }
        shell: pwsh
        continue-on-error: true

      # ── 4. Setup MSBuild ────────────────────────────────────────────────
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # ── 5. Check what include dirs exist (debug step) ───────────────────
      - name: List include and lib dirs
        run: |
          Write-Host "=== include ==="
          if (Test-Path include) { ls include } else { Write-Host "No include dir" }
          Write-Host "=== lib ==="
          if (Test-Path lib) { ls lib } else { Write-Host "No lib dir" }
          Write-Host "=== src/thirdparty ==="
          if (Test-Path src/thirdparty) { ls src/thirdparty } else { Write-Host "No thirdparty dir" }
        shell: pwsh

      # ── 6. Build mpc-hc ─────────────────────────────────────────────────
      - name: Build mpc-hc (Release | Win32)
        run: |
          msbuild src\mpc-hc\mpc-hc.vcxproj `
            /p:Configuration=Release `
            /p:Platform=Win32 `
            /p:PlatformToolset=v143 `
            /m `
            /nologo `
            /clp:Summary `
            /v:minimal
        shell: pwsh

      # ── 7. Upload artifact ───────────────────────────────────────────────
      - name: Upload mpc-hc.exe
        uses: actions/upload-artifact@v4
        with:
          name: mpc-hc-darkmode-Win32-Release
          path: |
            **/mpc-hc.exe
            **/mpc-hc.pdb
          if-no-files-found: warn
          retention-days: 30
