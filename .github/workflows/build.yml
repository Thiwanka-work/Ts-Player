name: Build MPC-HC Dark Mode

on:
  push:
    branches: [ "develop", "main", "master" ]
  pull_request:
    branches: [ "develop", "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build MPC-HC (Release | Win32)
    runs-on: windows-2022

    steps:
      # ── 1. Configure Git globally to rewrite git:// to https:// ────────
      - name: Configure Git rewrite
        run: |
          git config --global url."https://".insteadOf "git://"
        shell: pwsh

      # ── 2. Checkout repository (top-level submodules only, no recursion) ──
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      # ── 3. Install YASM via Chocolatey ──────────────────────────────────
      - name: Install YASM
        run: |
          choco install yasm -y --no-progress
        shell: pwsh

      # ── 4. Clone Minimal DirectX SDK (June 2010) to bypass S1023 error ──
      - name: Clone DX SDK
        run: |
          git clone --depth 1 https://github.com/apitrace/dxsdk.git D:\dxsdk
          echo "DXSDK_DIR=D:\dxsdk\" >> $env:GITHUB_ENV
        shell: pwsh

      # ── 5. Create build.user.bat to satisfy environment variables ───────
      - name: Create build.user.bat
        run: |
          @'
          @ECHO OFF
          SET "MPCHC_MSYS=C:\Program Files\Git"
          SET "MPCHC_MINGW32=C:\Program Files\Git"
          SET "MPCHC_MINGW64=C:\Program Files\Git"
          SET "MPCHC_GIT=C:\Program Files\Git"
          SET "MPCHC_WINSDK_VER=10.0"
          '@ | Out-File -FilePath build.user.bat -Encoding ascii
        shell: pwsh

      # ── 6. Setup MSBuild ────────────────────────────────────────────────
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # ── 7. Build the project ────────────────────────────────────────────
      - name: Build mpc-hc (Release | Win32)
        run: |
          msbuild src\mpc-hc\mpc-hc.vcxproj `
            /p:Configuration=Release `
            /p:Platform=Win32 `
            /p:PlatformToolset=v143 `
            /p:MPCHC_WINSDK_VER=10.0 `
            /m `
            /nologo `
            /clp:Summary `
            /v:minimal
        shell: pwsh

      # ── 8. Upload .exe as GitHub artifact ───────────────────────────────
      - name: Upload mpc-hc.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: mpc-hc-darkmode-Win32-Release
          path: |
            **/mpc-hc.exe
            **/mpc-hc.pdb
          if-no-files-found: warn
          retention-days: 30
