name: Build MPC-HC Dark Mode

on:
  push:
    branches: [ "develop", "main", "master" ]
  pull_request:
    branches: [ "develop", "main", "master" ]
  workflow_dispatch:   # allows manual trigger from GitHub UI

jobs:
  build:
    name: Build MPC-HC (Release | Win32)
    runs-on: windows-2022   # VS 2022 with MSVC v143 + MFC pre-installed

    steps:
      # ── 1. Checkout code (no submodules yet) ────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false   # we handle submodules manually below

      # ── 2. Rewrite git:// → https:// (needed for old submodule URLs) ────
      - name: Rewrite git:// URLs to https://
        run: git config --global url."https://".insteadOf git://
        shell: pwsh

      # ── 3. Init only top-level submodules (shallow, skip broken ones) ───
      - name: Init submodules (shallow)
        run: git submodule update --init --depth=1
        shell: pwsh
        continue-on-error: true   # some sub-submodules may still fail; continue anyway

      # ── 4. Setup MSBuild ────────────────────────────────────────────────
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # ── 5. Build the project ────────────────────────────────────────────
      - name: Build mpc-hc (Release | Win32)
        run: |
          msbuild src\mpc-hc\mpc-hc.vcxproj `
            /p:Configuration=Release `
            /p:Platform=Win32 `
            /p:PlatformToolset=v143 `
            /m `
            /nologo `
            /clp:Summary `
            /v:minimal
        shell: pwsh

      # ── 6. Upload .exe as GitHub artifact (downloadable) ────────────────
      - name: Upload mpc-hc.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: mpc-hc-darkmode-Win32-Release
          path: |
            **/mpc-hc.exe
            **/mpc-hc.pdb
          if-no-files-found: warn
          retention-days: 30    # artifact available for 30 days
